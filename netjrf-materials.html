<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="materials.css">
<title>NET JRF Materials | The Ravishankar Insights</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#07111f,#123b5d);
  color:white;
  padding:25px 18px;
}

header h1{
  max-width:1100px;
  margin:auto;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 18px;
}

.section-title{
  margin:30px 0 15px;
  color:#123b5d;
}

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 7px 22px rgba(0,0,0,.08);
}

.card h3{
  color:#123b5d;
  margin-bottom:18px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

button{
  border:0;
  padding:10px 12px;
  border-radius:9px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.pdf{
  background:#1677ff;
}

.upload-pdf{
  background:#198754;
}

.video{
  background:#e67e22;
}
</style>
</head>

<body>

<header>
  <h1>🎓 NET JRF Study Materials</h1>
</header>

<div class="container">

<!-- PAPER 1 -->

<h2 class="section-title">📘 NET JRF Paper 1</h2>

<div class="grid">

<div class="card">
  <h3>Paper 1 — Teaching & Research Aptitude</h3>

  <div class="buttons">
    <button class="pdf">📄 Open PDF</button>
    <button class="upload-pdf">🔐 Admin PDF Upload</button>
    <button class="video">🎥 Admin Video Upload</button>
  </div>
</div>

</div>


<!-- PAPER 2 -->

<h2 class="section-title">📕 NET JRF Paper 2</h2>

<div class="grid">

<div class="card">
  <h3>Political Science — Paper 2</h3>

  <div class="buttons">
    <button class="pdf">📄 Open PDF</button>
    <button class="upload-pdf">🔐 Admin PDF Upload</button>
    <button class="video">🎥 Admin Video Upload</button>
  </div>
</div>

</div>

</div>

</body>
</html>
