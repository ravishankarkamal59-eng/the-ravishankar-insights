<!DOCTYPE html>

<title>MA PDF Materials | The Ravishankar Insights</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#07111f,#123b5d);
  color:white;
  padding:25px 18px;
}

header h1{
  max-width:1100px;
  margin:auto;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 18px;
}

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:24px;
  border-radius:18px;
  box-shadow:0 7px 22px rgba(0,0,0,.08);
}

.card h2{
  color:#123b5d;
  margin-bottom:18px;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:0;
  padding:10px 15px;
  border-radius:9px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.open{
  background:#1677ff;
}

.upload{
  background:#198754;
}
</style>
</head>
