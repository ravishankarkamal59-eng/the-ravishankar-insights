<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login | The Ravishankar Insights</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#07111f,#123b5d);
}
.card{
  width:92%;
  max-width:420px;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}
h1{text-align:center;color:#123b5d}
p{text-align:center;color:#666}
label{
  display:block;
  margin-top:16px;
  font-weight:bold;
}
input{
  width:100%;
  padding:13px;
  margin-top:7px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}
button{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#1677ff;
  color:white;
  font-size:16px;
  font-weight:bold;
}
#message{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
<h1>🔐 Admin Login</h1>
<p>The Ravishankar Insights</p>

<form id="adminLoginForm">

<label>Username</label>
<input id="username" type="text" required>

<label>Password</label>
<input id="password" type="password" required>

<button type="submit">Login</button>

<div id="message"></div>

</form>
</div>

<script>
const API =
"https://ravishankar-insights-backend-1.onrender.com";

document.getElementById("adminLoginForm").addEventListener("submit",
async function(e){

e.preventDefault();

const message = document.getElementById("message");
message.style.color = "black";
message.textContent = "Login हो रहा है...";

try{

const response = await fetch(API + "/api/admin/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:document.getElementById("username").value,
password:document.getElementById("password").value
})
});

const data = await response.json();

if(!response.ok){
message.style.color="red";
message.textContent=data.message || "Login failed.";
return;
}

localStorage.setItem("adminToken",data.token);

message.style.color="green";
message.textContent="Admin Login सफल!";

setTimeout(()=>{
window.location.href="admin-dashboard.html";
},700);

}catch(error){

message.style.color="red";
message.textContent=
"Backend से connection नहीं हो पाया।";
}

});
</script>

</body>
</html>
