<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Articles | The Ravishankar Insights</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#07111f,#123b5d);
  color:white;
  padding:25px 18px;
}

header h1{
  max-width:1100px;
  margin:auto;
}

.container{
  max-width:900px;
  margin:30px auto;
  padding:0 18px;
}

.card{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 7px 22px rgba(0,0,0,.08);
}

h2{
  color:#123b5d;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:16px;
}

textarea{
  min-height:300px;
  resize:vertical;
}

button{
  margin-top:18px;
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#1677ff;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#message{
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>✍️ Admin Article Panel</h1>
</header>

<div class="container">

<div class="card">

<h2>📝 नया Article लिखें</h2>

<label>Article Title</label>

<input
type="text"
id="title"
placeholder="Article का Title लिखें"
>

<label>Category</label>

<select id="category">

<option value="General">General</option>
<option value="UPSC">UPSC</option>
<option value="UPPCS">UPPCS</option>
<option value="NET JRF">NET JRF</option>
<option value="Railway">Railway</option>
<option value="SSC">SSC</option>
<option value="Banking">Banking</option>
<option value="BA">BA</option>
<option value="MA">MA</option>

</select>

<label>Article लिखें</label>

<textarea
id="article"
placeholder="यहाँ पूरा Article लिखें..."
></textarea>

<button onclick="saveArticle()">
💾 Save Article
</button>

<div id="message"></div>

</div>

</div>

<script>

async function saveArticle(){

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value;

  const article =
    document.getElementById("article").value.trim();

  const message =
    document.getElementById("message");


  if(!title){

    message.style.color="red";
    message.textContent="Article का Title लिखें।";
    return;

  }


  if(!article){

    message.style.color="red";
    message.textContent="Article लिखें।";
    return;

  }


  try{

    const response = await fetch(
      "https://ravishankar-insights-backend-1.onrender.com/api/articles",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          title:title,
          category:category,
          article:article
        })
      }
    );


    const data = await response.json();


    if(response.ok){

      message.style.color="green";

      message.textContent =
        "✅ Article सफलतापूर्वक Save हो गया।";

      document.getElementById("title").value="";
      document.getElementById("article").value="";

    }else{

      message.style.color="red";
      message.textContent=data.message;

    }

  }catch(error){

    console.log(error);

    message.style.color="red";

    message.textContent =
      "❌ अभी सेवा उपलब्ध नहीं है। कृपया थोड़ी देर बाद फिर प्रयास करें।";

  }

}

</script>

</body>
</html>
