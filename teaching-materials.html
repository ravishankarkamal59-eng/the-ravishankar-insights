<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teaching & Education | The Ravishankar Insights</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

header{
  padding:25px 15px;
  text-align:center;
  background:linear-gradient(135deg,#172554,#2563eb);
  color:white;
}

header h1{
  margin:0 0 8px;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-size:15px;
}

.pdf{
  background:#2563eb;
  color:white;
}

.upload,
.video{
  background:#ddd;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.back{
  display:inline-block;
  margin-top:25px;
  padding:11px 18px;
  background:#111827;
  color:white;
  text-decoration:none;
  border-radius:10px;
}

.admin-only{
  display:none !important;
}
</style>
</head>

<body>

<header>
  <h1>👨‍🏫 Teaching & Education</h1>
  <p>CTET • TET • TGT • PGT Study Materials</p>
</header>

<div class="container">

<div class="grid">

<div class="card">
  <h2>👨‍🏫 CTET</h2>
  <p>Central Teacher Eligibility Test</p>

  <div class="buttons">
    <button class="pdf">📄 Open PDF</button>
    <button class="upload admin-only">🔐 Admin PDF Upload</button>
    <button class="video admin-only">🎥 Admin Video Upload</button>
  </div>
</div>

<div class="card">
  <h2>👩‍🏫 TET</h2>
  <p>Teacher Eligibility Tests</p>

  <div class="buttons">
    <button class="pdf">📄 Open PDF</button>
    <button class="upload admin-only">🔐 Admin PDF Upload</button>
    <button class="video admin-only">🎥 Admin Video Upload</button>
  </div>
</div>

<div class="card">
  <h2>📚 TGT</h2>
  <p>Trained Graduate Teacher Exams</p>

  <div class="buttons">
    <button class="pdf">📄 Open PDF</button>
    <button class="upload admin-only">🔐 Admin PDF Upload</button>
    <button class="video admin-only">🎥 Admin Video Upload</button>
  </div>
</div>

<div class="card">
  <h2>📚 PGT</h2>
  <p>Post Graduate Teacher Exams</p>

  <div class="buttons">
    <button class="pdf">📄 Open PDF</button>
    <button class="upload admin-only">🔐 Admin PDF Upload</button>
    <button class="video admin-only">🎥 Admin Video Upload</button>
  </div>
</div>

</div>

<a class="back" href="student-dashboard.html">
  ← Back to Student Dashboard
</a>

</div>

<script>
const API =
  "https://ravishankar-insights-backend-1.onrender.com";

async function loadTeachingMaterials(){

  try{

    const response =
      await fetch(API + "/api/materials/teaching");

    const data =
      await response.json();

    const pdfButtons =
      document.querySelectorAll(".pdf");

    const pdfFiles =
      (data.files || []).filter(file =>
        file.name.toLowerCase().endsWith(".pdf")
      );

    pdfButtons.forEach((button,index)=>{

      if(pdfFiles[index]){

        button.disabled = false;

        button.onclick = () => {

          window.open(
            API + pdfFiles[index].url,
            "_blank"
          );

        };

      }else{

        button.textContent =
          "📄 PDF अभी उपलब्ध नहीं";

        button.disabled = true;

      }

    });

  }catch(error){

    console.error(
      "Teaching materials error:",
      error
    );

  }

}

document.addEventListener(
  "DOMContentLoaded",
  loadTeachingMaterials
);
</script>

</body>
</html>
